        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }

        .container {

        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .map-section, .filter-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .map-placeholder {
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 10px;
            height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .map-icon {
            font-size: 4rem;
            color: #3498db;
            margin-bottom: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group select:focus {
            outline: none;
            border-color: #3498db;
        }

        .vets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .vet-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border-left: 5px solid #27ae60;
        }

        .vet-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .vet-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .vet-avatar {
            width: 60px;
            height: 60px;
            background: #e8f5e8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-right: 15px;
        }

        .vet-info h3 {
            font-size: 1.3rem;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .vet-info p {
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .vet-details {
            margin-bottom: 15px;
        }

        .vet-detail {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            color: #555;
            font-size: 0.9rem;

        .vet-detail span:first-child {
            margin-right: 10px;

        }

        .distance-badge {
            background: #e74c3c;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
        }

        .vet-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 0.9rem;
            flex: 1;
            min-width: 100px;
        }

        .btn-directions {
            background: #3498db;
        }

        .btn-call {
            background: #27ae60;
        }

        .btn-email {

            gap: 8px;

        .status-badge {
            background: #27ae60;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .vets-grid {

            }
            
            .header h1 {

    </style>

        let currentLocation = null;
        let filteredVets = [...veterinarians];

        // Initialize the page
        function init() {
            displayVets(veterinarians);
        }

        // Get user location
        function getLocation() {
            const btn = document.getElementById('location-btn-text');
            const locationInfo = document.getElementById('location-info');
            const coordinates = document.getElementById('coordinates');
            
            btn.textContent = 'Getting location...';
            
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser.');
                btn.textContent = 'Get My Location';
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    
                    coordinates.textContent = `Lat: ${currentLocation.lat.toFixed(6)}, Lng: ${currentLocation.lng.toFixed(6)}`;
                    locationInfo.style.display = 'block';
                    btn.textContent = 'Location Found!';
                    
                    alert(`Location obtained! Lat: ${currentLocation.lat.toFixed(6)}, Lng: ${currentLocation.lng.toFixed(6)}`);
                },
                (error) => {
                    let errorMessage = 'Failed to get your location.';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMessage = 'Location permission denied. Please enable location access in your browser settings.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMessage = 'Location information is unavailable.';
                            break;
                        case error.TIMEOUT:
                            errorMessage = 'Location request timed out.';
                            break;
                    }
                    alert(errorMessage);
                    btn.textContent = 'Get My Location';
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // Filter veterinarians
        function filterVets() {
            const animalType = document.getElementById('animal-type').value;
            const radius = parseInt(document.getElementById('search-radius').value);
            
            let filtered = [...veterinarians];
            
            // Filter by animal type
            if (animalType) {
                filtered = filtered.filter(vet => 
                    vet.animals.some(animal => 
                        animal.toLowerCase().includes(animalType.toLowerCase())
                    )
                );
            }
            
            // Filter by distance
            filtered = filtered.filter(vet => vet.distance <= radius);
            
            // Sort by distance
            filtered.sort((a, b) => a.distance - b.distance);
            
            filteredVets = filtered;
            displayVets(filtered);
            
            // Update count
            document.getElementById('vet-count').textContent = `${filtered.length} Veterinarians Available`;
            
            // Show message
            if (filtered.length === 0) {
                alert(`No veterinarians found within ${radius}km${animalType ? ` for ${animalType}` : ''}`);
            } else {
                alert(`Showing ${filtered.length} veterinarians within ${radius}km${animalType ? ` for ${animalType}` : ''}`);
            }
        }

        // Display veterinarians
        function displayVets(vets) {
            const grid = document.getElementById('vets-grid');
            grid.innerHTML = '';
            
            vets.forEach(vet => {
                const card = createVetCard(vet);
                grid.appendChild(card);
            });
        }

        // Create veterinarian card
        function createVetCard(vet) {
            const card = document.createElement('div');
            card.className = 'vet-card';
            
            const stars = '★'.repeat(Math.floor(vet.rating)) + 
                         (vet.rating % 1 >= 0.5 ? '☆' : '');
            
            card.innerHTML = `
                <div class="vet-header">
                    <div class="vet-avatar">${vet.avatar}</div>
                    <div class="vet-info">
                        <h3>${vet.name}</h3>
                        <p>${vet.specialty}</p>
                    </div>
                </div>
                
                <div class="vet-details">
                    <div class="vet-detail">
                        <span>🏥</span>
                        <span>${vet.clinic}</span>
                    </div>
                    <div class="vet-detail">
                        <span>📍</span>
                        <span>${vet.address}</span>
                    </div>
                    <div class="vet-detail">
                        <span>📞</span>
                        <span>${vet.phone}</span>
                    </div>
                    <div class="vet-detail">
                        <span>⭐</span>
                        <span>${vet.rating} (${vet.reviews} reviews)</span>
                    </div>
                </div>
                
                <div class="distance-badge">
                    📍 ${vet.distance.toFixed(1)} km away
                </div>
                
                <div class="vet-actions">
                    <button class="btn btn-small btn-directions" onclick="getDirections('${vet.address}')">
                        🗺️ Directions
                    </button>
                    <button class="btn btn-small btn-call" onclick="callVet('${vet.phone}')">
                        📞 Call
                    </button>
                    <button class="btn btn-small btn-email" onclick="emailVet('${vet.email}')">
                        ✉️ Email
                    </button>
                </div>
            `;
            
            return card;
        }

        // Action functions
        function getDirections(address) {
            const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
            window.open(url, '_blank');
        }

        function callVet(phone) {
            window.open(`tel:${phone}`, '_blank');
        }

        function emailVet(email) {
            window.open(`mailto:${email}`, '_blank');
        }
